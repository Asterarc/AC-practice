<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分析化学刷题本</title>
<style>
:root{
  --pri:#4f6bf0; --pri-d:#3b55d9; --pri-bg:#eef1fe;
  --ok:#16a34a; --ok-bg:#e9f9ef; --bad:#e11d48; --bad-bg:#fdeef2;
  --ink:#1f2430; --ink-2:#5b6272; --line:#e5e8ef; --bg:#f4f6fa; --card:#fff;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;
  min-height:100vh;font-size:16px;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px;}
@media(min-width:700px){.wrap{padding:36px 24px 64px;}}

/* ---------- 首页 ---------- */
.home-head{text-align:center;margin:24px 0 30px;}
.home-head .logo{
  width:60px;height:60px;border-radius:18px;margin:0 auto 14px;
  background:linear-gradient(135deg,#4f6bf0,#7c5cf0);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;box-shadow:0 8px 20px rgba(79,107,240,.35);
}
.home-head h1{font-size:clamp(22px,4.5vw,30px);letter-spacing:1px;}
.home-head .sub{color:var(--ink-2);font-size:14px;margin-top:6px;}
.paper-grid{display:grid;gap:16px;}
@media(min-width:700px){.paper-grid{grid-template-columns:1fr 1fr;gap:20px;}}
.paper-card{
  background:var(--card);border-radius:var(--radius);padding:22px 20px;
  border:1px solid var(--line);cursor:pointer;
  transition:transform .18s,box-shadow .18s;
  display:flex;flex-direction:column;gap:14px;
}
.paper-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(31,36,48,.10);}
.paper-card .pk-badge{
  align-self:flex-start;font-size:12px;font-weight:600;color:var(--pri);
  background:var(--pri-bg);padding:3px 10px;border-radius:99px;
}
.paper-card h2{font-size:18px;line-height:1.4;}
.paper-card .pk-meta{color:var(--ink-2);font-size:13px;}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f6bf0,#7c5cf0);border-radius:99px;transition:width .4s;}
.pk-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);}
.pk-stats b{color:var(--ink);font-size:15px;}
.pk-go{
  margin-top:2px;text-align:center;padding:11px 0;border-radius:10px;
  background:var(--pri);color:#fff;font-size:15px;font-weight:600;
}
.paper-card:hover .pk-go{background:var(--pri-d);}
.home-tip{
  margin-top:28px;text-align:center;color:var(--ink-2);font-size:12.5px;
  background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;
}

/* ---------- 卷内页 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  margin:-20px -16px 14px;padding:12px 16px;
  display:flex;align-items:center;gap:10px;
}
@media(min-width:700px){.topbar{margin:-36px -24px 20px;padding:14px 24px;}}
.back{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:7px 13px;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;
}
.back:active{background:var(--bg);}
.topbar .tb-title{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-pct{font-size:13px;color:var(--pri);font-weight:700;white-space:nowrap;}

.statcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:14px;
}
.statcard .bar{margin-top:10px;}
.stat-line{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);}
.stat-line b{color:var(--ink);}
.stat-line .g{color:var(--ok);} .stat-line .r{color:var(--bad);}

.controls{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px;
}
.ctl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ctl-label{font-size:13px;color:var(--ink-2);flex-shrink:0;}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap;}
.seg button{
  border:none;background:transparent;border-radius:8px;padding:7px 14px;
  font-size:14px;color:var(--ink-2);cursor:pointer;font-weight:500;
}
.seg button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 1px 4px rgba(31,36,48,.12);}
.seg button.on[data-filter="wrong"]{color:var(--bad);}
.reset{
  margin-left:auto;border:1px solid #f3c6ce;background:#fff;color:var(--bad);
  border-radius:9px;padding:7px 13px;font-size:13.5px;cursor:pointer;
}
.reset:active{background:var(--bad-bg);}
@media(max-width:520px){.reset{margin-left:0;width:100%;}}

/* ---------- 题目 ---------- */
.sec-title{
  font-size:15px;font-weight:700;color:var(--ink);
  margin:26px 0 12px;display:flex;align-items:center;gap:8px;
}
.sec-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--pri);}
.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;margin-bottom:14px;
}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qno{font-size:13px;color:var(--ink-2);}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:600;}
.tag.ok{color:var(--ok);background:var(--ok-bg);}
.tag.bad{color:var(--bad);background:var(--bad-bg);}
.tag.todo{color:#b45309;background:#fef3e2;}
.stem{font-size:15.5px;white-space:pre-wrap;word-break:break-word;}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;
  border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:11px 13px;font-size:15px;cursor:pointer;color:var(--ink);
  transition:border-color .15s,background .15s;
}
.opt:active{background:var(--bg);}
.opt b{color:var(--pri);flex-shrink:0;}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);}
.opt.correct b{color:var(--ok);}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);}
.opt.wrong b{color:var(--bad);}
.opt img{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block;}
.opt.locked{cursor:default;}
.analysis{
  margin-top:12px;border-radius:10px;background:var(--pri-bg);
  padding:11px 14px;font-size:14px;color:#2c3350;white-space:pre-wrap;word-break:break-word;
  display:none;
}
.analysis.show{display:block;}
.analysis b{color:var(--pri);}
.essay-btn{
  margin-top:14px;border:1px solid var(--pri);background:var(--pri-bg);color:var(--pri);
  border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;
}
.essay-btn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
.essay-acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.essay-acts .essay-btn{margin-top:0;}
.empty{
  text-align:center;color:var(--ink-2);padding:48px 0;font-size:15px;
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
}
@media(max-width:520px){
  .qcard{padding:15px 14px 14px;}
  .stem{font-size:15px;}
  .opt{padding:11px 12px;font-size:14.5px;}
}
</style>
</head>

{n:1,t:"c",q:"柱效率用理论塔板数n或理论塔板高度h表示，柱效率越高，则:",o:["n越大，h越小","n越小，h越大","n越大，h越大","n越小，h越小"],a:"A",an:"柱效越高，理论塔板数 n 越大，塔板高度 h 越小（h=L/n，二者成反比）。"},
{n:2,t:"c",q:"在下列方法中，组分的涡流扩散可忽略不计的是",o:["毛细管气相色谱法","高效液相色谱法","气相色谱法","超临界色谱法"],a:"A",an:"毛细管柱（开管柱）内无填充颗粒，涡流扩散项 A=0。"},
{n:3,t:"c",q:"用0.1mol/L HCl滴定0.1mol/L NaOH的pH突跃为9.7~4.3，则用0.01mol/L HCl滴定0.01mol/L NaOH的pH突跃范围为",o:["9.7~4.3","8.7~4.3","9.7~5.3","8.7~5.3"],a:"D",an:"强酸强碱互滴，浓度每稀释10倍，突跃范围两端各缩小1个pH单位，共缩小2个单位：9.7-1=8.7，4.3+1=5.3。"},
{n:4,t:"c",q:"在定量分析中，精密度与准确度之间的关系是",o:["精密度高，准确度也必然高","准确度高，精密度也就高","精密度是保证准确度的前提","准确度是保证精密度的前提"],a:"C",an:"精密度高是准确度高的前提；但精密度高不一定准确度高（可能存在系统误差）。"},
{n:5,t:"c",q:"下列说法中错误的是",o:["酸效应使络合物稳定性降低","共存离子效应使络合物稳定性降低","其他络合剂的络合效应使络合物稳定性降低","所有副反应均使络合物稳定性降低"],a:"D",an:"并非所有副反应都降低稳定性，例如生成物发生副反应（形成混配络合物等）可使表观稳定性提高。"},
{n:6,t:"c",q:"在滴定分析中，属于偶然误差的是",o:["试样未经充分混合","砝码生锈","滴定管最后一位数字估读不准","滴定时有溶液溅出"],a:"C",an:"估读不准具有随机性，属偶然误差；砝码生锈是系统误差；未混匀、溅出属过失误差。"},
{n:7,t:"c",q:"配位滴定中，金属指示剂的封闭现象是由于",o:["KMY＜KMIn","KMY=KMIn","KMY＞KMIn","KMY≠KMIn"],a:"A",an:"当 KMIn > KMY 时，EDTA 不能夺取指示剂中的金属离子，终点不变色，产生封闭现象。"},
{n:8,t:"c",q:"实验室用盐酸标定氢氧化钠溶液时，所消耗的体积应记录为",o:["20ml","20.0ml","20.00ml","20.000ml"],a:"C",an:"滴定管最小刻度0.1mL，可估读到0.01mL，应记录到小数点后两位。"},
{n:9,t:"c",q:"移液管移取溶液时，当液面上升至标线以上，应用___堵住管口。",o:["右手食指","左手食指","右手拇指","左手拇指"],a:"A",an:"规范操作：右手持移液管，用右手食指堵住管口调节液面。"},
{n:10,t:"c",q:"在分配色谱法中，固定相极性大于流动相者（ ）",o:["称为正相色谱，该色谱法在分离组分时，极性大的组分先洗脱","称为正相色谱，该色谱法在分离组分时，极性小的组分先洗脱","称为反相色谱，该色谱法在分离组分时，极性大的组分先洗脱","称为反相色谱，该色谱法在分离组分时，极性小的组分先洗脱"],a:"B",an:"固定相极性>流动相极性为正相色谱；极性小的组分与固定相作用弱，先被洗脱。"},
{n:11,t:"c",q:"高锰酸钾法所用的指示剂是（ ）",o:["KMnO4","K2Cr2O7","KI","淀粉"],a:"A",an:"KMnO4 自身呈紫色，过量半滴即显色，为自身指示剂。"},
{n:12,t:"c",q:"酸碱滴定中选择指示剂的原则是（ ）",o:["指示剂变色范围与化学计量点完全符合","指示剂的变色范围应全部或部分落入滴定pH突跃范围之内","指示剂应在pH=7.00时变色","指示剂变色范围应全部落在滴定pH突跃范围之内"],a:"B",an:"变色范围全部或部分落在突跃范围内即可，不要求全部落入，也不要求pH=7变色。"},
{n:13,t:"c",q:"表示色谱柱效率可以用",o:["理论塔板数","分配系数","保留值","载气流速"],a:"A",an:"柱效用理论塔板数 n 或理论塔板高度 h 表示。"},
{n:14,t:"c",q:"荧光分析中常用的激发光源不包括",o:["氙灯","氘灯","激光","红外炉"],a:"D",an:"红外炉是加热设备，不作荧光激发光源；常用氙灯、氘灯、激光等。"},
{n:15,t:"c",q:"液相色谱分析中，要求两组分达到基线分离，分离度应是",o:["R≥0.1","R≥0.7","R≥1","R≥1.5"],a:"D",an:"R≥1.5 时认为两组分达到基线分离（完全分离）。"},
{n:16,t:"c",q:"比较两组测定结果的精密度（ ）\n甲组：0.19%，0.19%，0.20%，0.21%，0.21%\n乙组：0.18%，0.20%，0.20%，0.21%，0.22%",o:["甲、乙两组相同","甲组比乙组高","乙组比甲组高","无法判别"],a:"B",an:"甲组平均值0.20%，平均偏差约0.008%；乙组平均值0.202%，平均偏差约0.0104%。甲组偏差小，精密度高。"},
{n:17,t:"c",q:"溶液pH值的测定最常用的电极是",o:["目前最常用的参比电极是pH玻璃电极","目前最常用的参比电极为饱和甘汞电极","目前最常用的参比电极为标准氢电极","目前最常用的参比电极为pM汞电极"],a:"B",an:"测pH时pH玻璃电极作指示电极，最常用的参比电极是饱和甘汞电极（SCE）。"},
{n:18,t:"c",q:"某物质在某波长处的摩尔吸收系数很大，则表明",o:["该物质对某波长的吸收能力很强","该物质浓度很大","光通过该物质的溶液的光程长","测定该物质的精密度很高"],a:"A",an:"摩尔吸收系数 ε 是物质本身的性质，ε 越大表示对该波长光的吸收能力越强。"},
{n:19,t:"c",q:"钨/卤钨灯可作为下列哪种光的光源",o:["紫外光","可见光","红外光","原子吸收"],a:"B",an:"钨灯/卤钨灯发射320~2500nm，主要用作可见光区光源；紫外区用氘灯。"},

{n:27,t:"c",q:"在滴定分析中，关于滴定突跃的叙述正确的是（ ）",o:["滴定反应的平衡常数越大，突跃范围越小","被滴定物的浓度越高，突跃范围越大","突跃范围越小，滴定越准确","指示剂的变色范围越大，突跃范围越大"],a:"B",an:"浓度越高、平衡常数越大，突跃范围越大；突跃越大越有利于准确滴定。"},
{n:28,t:"c",q:"某酸碱指示剂的KHIn=1×10⁻⁵，其理论变色范围是pH（ ）",o:["4~5","5~6","4~6","5~7"],a:"C",an:"pKHIn=5，理论变色范围 pH=pKHIn±1=4~6。"},
{n:29,t:"c",q:"在60MHz仪器中，某质子与TMS的共振频率相差120Hz，则质子的化学位移为",o:["1.2ppm","12ppm","6ppm","10ppm","2ppm"],a:"E",an:"δ=Δν/ν₀=120Hz/60MHz=2ppm。"},
{n:30,t:"c",q:"永停滴定法属于",o:["电解法","电导法","电位法","伏安法"],a:"D",an:"永停滴定法（双指示电极电流滴定）测量微电流随电压/滴定剂的变化，属于伏安法范畴。"},
{n:31,t:"c",q:"已知待测物的最大吸收波长为260 nm，在进行定量测定时，可以选择的溶剂是",o:["甲醇（截止波长205 nm）","乙酸乙酯（截止波长260 nm）","二氯甲烷（截止波长275 nm）","二硫化碳（截止波长385 nm）"],a:"A",an:"溶剂的截止波长必须小于测定波长260nm，只有甲醇（205nm）符合。"},
{n:32,t:"c",q:"下列对内标物的说法哪项是不正确的（ ）",o:["内标物须为原样品中不含的组分","内标物应尽量使其与待测物的保留时间相距最大","内标物为高纯度标准物质，或含量已知物质","内标物与待测物R>1.5"],a:"B",an:"内标物应与待测物性质相近、保留时间接近且能完全分离（R>1.5），并非相距越远越好。"},
{n:33,t:"c",q:"用0.01 mol/L的HCl滴定0.01 mol/L的NaOH的突跃范围是8.7~3.3，则用0.001 mol/L的HCl滴定0.001 mol/L的NaOH滴定的突跃范围是（ ）",o:["7.7~2.3","8.7~4.3","7.7~4.3","9.7~2.3"],a:"C",an:"浓度再稀释10倍，突跃两端各缩1个pH单位：8.7-1=7.7，3.3+1=4.3。"},
{n:34,t:"c",q:"0.05020、2.30×10⁻⁴、pH=0.05分别为几位有效数字（ ）",o:["6、3、3","5、2、3","4、3、2","4、3、3"],a:"C",an:"0.05020为4位（前导零不算，末尾零算）；2.30×10⁻⁴为3位；pH值小数部分才是有效数字，pH=0.05为2位。"},
{n:35,t:"c",q:"下列关于荧光光谱的叙述何者是错误的",o:["荧光光谱的形状与激发光的波长无关","荧光光谱和激发光谱一般是对称镜像关系","荧光光谱是分子的吸收光谱","荧光激发光谱和紫外吸收光谱相似"],a:"C",an:"荧光光谱是分子的发射光谱，不是吸收光谱。"},
{n:36,t:"c",q:"在(CH₃)₂CH-O-H的¹H NMR中，CH质子信号出现为（ ）",o:["一个4重峰","双4重峰","一个11重峰","一个7重峰"],a:"D",an:"次甲基CH两侧共6个等价甲基氢，按n+1规则裂分为6+1=7重峰。"},
{n:37,t:"c",q:"下列化合物中，在紫外区出现两个吸收带的是",o:["乙烯","1，4-戊二烯","1，3-丁二烯","丙烯醛"],a:"D",an:"丙烯醛（CH₂=CH-CHO）同时含π→π*（K带）和n→π*（R带）两个吸收带；孤立双键/非共轭二烯无此特征。"},
{n:38,t:"c",q:"酸碱滴定中选择指示剂的原则是（ ）",o:["指示剂变色范围与化学计量点完全符合","指示剂的变色范围应全部或部分落入滴定pH突跃范围之内","指示剂应在pH=7.00时变色","指示剂变色范围应全部落在滴定pH突跃范围之内"],a:"B",an:"与第12题相同。"},
{n:39,t:"c",q:"键合相的键合基团的碳链长度减小后（ ）",o:["极性减小","极性增大","载样量增大","载样量减小"],a:"D",an:"碳链越短，键合相的疏水作用越弱、键合量和载样量减小。"},
{n:40,t:"c",q:"在碘量法中，淀粉是专属指示剂，当溶液呈现蓝色时，这是（ ）",o:["游离碘的颜色","碘离子的颜色","游离碘与淀粉生成物的颜色","碘离子与淀粉生成物的颜色"],a:"C",an:"蓝色来自 I₂（游离碘）与淀粉形成的包结络合物。"}
]},
{name:"二、判断题（共15题）",list:[
{n:41,t:"j",q:"将缓冲溶液稀释1倍，溶液的酸度不发生明显的变化。",a:"对",an:"缓冲溶液pH=pKa+lg(c碱/c酸)，稀释时两者浓度同比变化，比值基本不变，pH基本不变。"},
{n:42,t:"j",q:"在沉淀过程中，聚集速度大于定向速度，沉淀颗粒聚集形成无定形沉淀。",a:"对",an:"聚集速度>定向速度时离子来不及按晶格排列，形成无定形沉淀；反之形成晶形沉淀。"},
{n:43,t:"j",q:"柱效率用理论塔板数n或理论塔板高度H表示，柱效率越高，则n越大。",a:"对",an:"n越大（H越小）柱效越高。"},
{n:44,t:"j",q:"选择合适的滴定方法和滴定试剂有助于降低滴定误差。",a:"对",an:"滴定误差是终点与化学计量点不一致造成的，选择合适方法和试剂（含指示剂）可减小该误差。"},
{n:45,t:"j",q:"试样的质量在0.1-10mg时，通常视为微量分析。",a:"对",an:"按试样量分类：常量>0.1g，半微量0.01~0.1g，微量0.1~10mg，超微量<0.1mg。"},
{n:46,t:"j",q:"强酸强碱滴定突跃的大小与酸碱溶液的浓度有关。",a:"对",an:"浓度越大，突跃范围越大。"},
{n:47,t:"j",q:"强酸强碱滴定突跃的大小与酸碱溶液的浓度有关。",a:"对",an:"与第46题相同。"},
{n:48,t:"j",q:"反相色谱主要分离分析强极性物质。",a:"错",an:"反相色谱固定相为非极性，主要分离弱极性或非极性物质；强极性物质先流出、保留弱。"},
{n:49,t:"j",q:"酸碱反应达到平衡时，酸失去的质子数与碱得到的质子数相等，即质子平衡。",a:"对",an:"这是质子条件（质子平衡）的定义。"},
{n:50,t:"j",q:"紫外-可见吸收光谱和荧光光谱均属于吸收光谱。",a:"错",an:"荧光光谱是发射光谱，不属于吸收光谱。"},
{n:51,t:"j",q:"紫外-可见吸收光谱是由分子振动引起的。",a:"错",an:"紫外-可见吸收由分子外层电子跃迁引起（伴随振动、转动能级变化）；分子振动对应红外光谱。"},
{n:52,t:"j",q:"误差是可以完全消除的。",a:"错",an:"误差只能减小，不能完全消除；偶然误差永远存在。"},
{n:53,t:"j",q:"只要分离度达到要求，应尽可能采用较长的色谱柱。",a:"错",an:"柱长增加虽提高分离度，但延长分析时间、增加柱压和峰展宽；分离度够即可，不必用长柱。"},
{n:54,t:"j",q:"色谱峰的峰宽是色谱峰两侧拐点在基线上所截的距离。",a:"对",an:"峰宽 W：通过两侧拐点作切线，切线与基线交点间的距离（W=4σ）。"},
{n:55,t:"j",q:"重复性指同样的操作条件下，在较短时间间隔内，由同一分析人员对同一试样测定所得结果的接近程度。",a:"对",an:"这是重复性的标准定义（同人、同仪器、短时间、同条件）。"}
]},
{name:"三、简答题（共4题）",list:[
{n:56,t:"e",q:"简述分析化学的定义和任务。（6分）",a:"定义：分析化学是研究物质化学组成、结构、含量和形态的分析方法及有关理论的一门科学（是化学学科的重要分支）。\n任务：① 定性分析——鉴定物质由哪些组分（元素、离子、官能团、化合物）组成；② 定量分析——测定各组分的含量；③ 结构分析——确定物质的分子结构、晶体结构；④ 形态分析——确定元素存在的价态与形态。"},
{n:57,t:"e",q:"简述影响沉淀纯度的因素。（6分）",a:"① 共沉淀现象：沉淀反应时某些可溶性杂质同时沉淀下来，包括：表面吸附（沉淀表面吸附杂质离子）、混晶（杂质离子与构晶离子半径、结构相近而形成混晶）、吸留与包藏（沉淀剂加入过快，杂质被包在沉淀内部）；② 后沉淀：沉淀析出后，母液中杂质在沉淀表面逐渐析出，放置时间越长越严重。\n减免方法：选择适当沉淀条件、洗涤沉淀、陈化、必要时再沉淀。"},
{n:58,t:"e",q:"色谱如何进行定性和定量分析？（7分）",a:"定性分析：主要依据保留值——在相同色谱条件下，将样品组分的保留时间（或调整保留时间、保留指数）与已知对照品比较，一致则可初步定性；也可联用质谱等确证。\n定量分析：依据峰面积或峰高与组分量成正比。常用方法：① 归一化法（各组分峰面积百分比，要求全部出峰）；② 外标法（标准曲线法）；③ 内标法（加入内标物，用相对校正因子计算）。"},
{n:59,t:"e",q:"简述从色谱图中可以获取哪些信息。（6分）",a:"① 色谱峰的个数——样品中所含组分的最少个数；② 保留值（保留时间）——定性依据；③ 峰面积或峰高——定量依据；④ 峰宽与保留值——计算理论塔板数，评价柱效；⑤ 两峰间距与峰宽——计算分离度，评价分离情况；⑥ 峰的对称性（对称因子）——判断色谱过程是否正常。"}
]},
{name:"四、计算题（共2题）",list:[
{n:60,t:"e",q:"用15cm长的ODS柱分离两个组分，柱效n=2.84×10⁴ m⁻¹，测得t₀=1.31 min，组分tR1=4.10 min，tR2=4.45 min。\n1）求k₁、k₂、α、R值\n2）若增加柱长至30 cm，分离度R可否达到1.5？（10分）",a:"1）k₁=(tR₁-t₀)/t₀=(4.10-1.31)/1.31≈2.13\nk₂=(4.45-1.31)/1.31≈2.40\nα=k₂/k₁=2.40/2.13≈1.13\n柱总塔板数 N=2.84×10⁴×0.15=4260\nR=(√N/4)×[(α-1)/α]×[k₂/(1+k₂)]=(√4260/4)×(0.13/1.13)×(2.40/3.40)≈16.3×0.115×0.706≈1.29（保留2位小数约1.3）\n2）柱长加倍则N加倍，R与√N成正比：R₂=1.29×√2≈1.82>1.5，故柱长增至30cm可达到基线分离（R≥1.5）。"},
{n:61,t:"e",q:"从色谱图上测得组分A和B的保留时间tR分别为10.52min和11.36min，两峰宽度W分别为0.38min和0.48min，问该两峰是否达到完全分离？（10分）",a:"R=2(tR₂-tR₁)/(W₁+W₂)=2×(11.36-10.52)/(0.38+0.48)=1.68/0.86≈1.95\n因为R≈1.95≥1.5，所以两组分达到基线分离（完全分离）。\n（注：原题W₂印为“.048min”，按0.48min理解；若按0.048则R更大，结论不变。）"}
]}]},
p2:{name:"试卷二（分析化学 2026药学专业(2)）",sections:[
{name:"一、单选题（共40题）",list:[
{n:1,t:"c",q:"在反相色谱法中，若以甲醇-水为流动相，增加甲醇的比例时，组分的容量因子k与保留时间tR的变化为",o:["k与tR增大","k与tR减小","k与tR不变","k增大，tR减小"],a:"B",an:"反相色谱中甲醇比例↑→流动相极性↓→洗脱能力↑→组分保留减弱，k与tR均减小。"},
{n:2,t:"c",q:"下列说法中错误的是",o:["酸效应使络合物稳定性降低","共存离子效应使络合物稳定性降低","其他络合剂的络合效应使络合物稳定性降低","所有副反应均使络合物稳定性降低"],a:"D",an:"并非所有副反应都降低稳定性（如生成物副反应可提高表观稳定性）。"},
{n:3,t:"c",q:"在反相色谱法中，若以甲醇-水为流动相，增加甲醇的比例时，组分的容量因子k与保留时间tR的变化为",o:["k与tR增大","k与tR减小","k与tR不变","k增大，tR减小"],a:"B",an:"与第1题相同。"},
{n:4,t:"c",q:"在化合物的紫外吸收光谱中，K带是指",o:["n→σ*跃迁","共轭非封闭体系的n→π*跃迁","σ→σ*跃迁","共轭非封闭体系的π→π*跃迁"],a:"D",an:"K带由共轭双键（非封闭共轭体系）的π→π*跃迁产生，ε很大（>10⁴）。"},
{n:5,t:"c",q:"在定量分析中，精密度与准确度之间的关系是",o:["精密度高，准确度也必然高","准确度高，精密度也就高","精密度是保证准确度的前提","准确度是保证精密度的前提"],a:"C",an:"精密度是准确度的前提。"},
{n:6,t:"c",q:"根据分析方法的试样用量分类，下列属于微量分析的是（ ）",o:["<0.1 mg","10~0.1 mg","<0.01 ml","10~1 ml"],a:"B",an:"微量分析：试样质量0.1~10mg（即10~0.1mg）。"},
{n:7,t:"c",q:"下列化合物中，不能产生红外图谱的是",o:["HCl","O₂","CH₄","CH₂CH₂"],a:"B",an:"O₂为同核双原子分子，振动无偶极矩变化，无红外活性。"},
{n:8,t:"c",q:"已知待测物的最大吸收波长为260 nm，在进行定量测定时，可以选择的溶剂是",o:["甲醇（截止波长205 nm）","乙酸乙酯（截止波长260 nm）","二氯甲烷（截止波长275 nm）","二硫化碳（截止波长385 nm）"],a:"A",an:"溶剂截止波长须小于260nm，只有甲醇（205nm）符合。"},
{n:9,t:"c",q:"助色团对谱带的影响是使谱带",o:["波长变长","波长变短","波长不变","谱带蓝移"],a:"A",an:"助色团（含孤对电子的基团）使吸收带红移（波长变长）、吸收增强。"},
{n:10,t:"c",q:"标定硫代硫酸钠的基准物质是（ ）",o:["草酸钠","草酸铵","铁离子","重铬酸钾"],a:"D",an:"标定Na₂S₂O₃常用K₂Cr₂O₇（置换碘量法）作基准物质。"},
{n:11,t:"c",q:"可以直接滴定测定Ag⁺的方法为（ ）",o:["铬酸钾指示剂法","铁铵矾指示剂法","吸附指示剂法","高锰酸钾法"],a:"B",an:"佛尔哈德法（铁铵矾指示剂）以NH₄SCN直接滴定Ag⁺；莫尔法测卤素。"},
{n:12,t:"c",q:"强碱滴定强酸的一阶导数图大致变化曲线应是",o:[IMG1,IMG2,IMG3,IMG4],a:"D",an:"一阶导数ΔpH/ΔV在化学计量点处达最大值，曲线呈单一尖峰（D）。B为二阶导数图（过零发散），C为普通滴定曲线。"},
{n:13,t:"c",q:"可见光波长区间为",o:["400nm以下","400-760nm","30cm至1mm之间","0.001nm到10nm"],a:"B",an:"可见光400~760nm；400nm以下为紫外，760nm以上为红外。"},
{n:14,t:"c",q:"在ATR-FTIR（衰减全反射红外）与传统透射FTIR比较时，下列说法正确的是",o:["ATR对样品制备要求更高，需要压片","ATR只适合气体样品","ATR测量深度较浅，适合表面或薄层分析","ATR无法测量固体样品"],a:"C",an:"ATR利用衰逝波，穿透深度仅约0.5~2μm，适合表面/薄层分析，且无需压片、可直接测固体液体。"},
{n:15,t:"c",q:"某物质在紫外区吸收度，下列仪器的设置正确的为",o:["氘灯，玻璃比色皿","钨灯，石英比色皿","氘灯，石英比色皿","钨灯，玻璃比色皿"],a:"C",an:"紫外区必须用氘灯（紫外光源）+石英比色皿（玻璃吸收紫外光）。"},
{n:16,t:"c",q:"在定量分析中，精密度与准确度之间的关系是（ ）",o:["精密度高，准确度必然高","准确度是保证精密度的前提","精密度是保证准确度的前提","准确度高，精密度必然高"],a:"C",an:"精密度是准确度的前提。"},
{n:17,t:"c",q:"色谱峰对称因子为0.8，则该峰属于（ ）",o:["对称峰","前延峰","拖尾峰","上述都不正确"],a:"B",an:"对称因子（拖尾因子）T=1为对称峰；T<1（<0.95）为前延峰；T>1（>1.05）为拖尾峰。0.8属前延峰。"},

{name:"三、简答题（共4题）",list:[
{n:56,t:"e",q:"什么是基准物质？基准物质的必备条件是什么？（7分）",a:"基准物质：能用于直接配制标准溶液或标定标准溶液浓度的物质。\n必备条件：① 纯度高（一般≥99.9%），杂质含量少到可忽略；② 组成与化学式完全一致（含结晶水的物质结晶水含量也应固定）；③ 性质稳定，在空气中不吸湿、不吸收CO₂、不被氧化、干燥时不分解；④ 具有较大的摩尔质量，以减小称量误差；⑤ 与滴定剂的反应定量、完全、速度快。"},
{n:57,t:"e",q:"什么是pH玻璃电极的碱差和酸差？（5分）",a:"碱差（钠差）：用pH玻璃电极测定pH>9~10的强碱性溶液时，溶液中Na⁺等碱金属离子也参与膜电位响应，使测得的pH值偏低于真实值，这种误差称为碱差。\n酸差：测定pH<1的强酸性溶液时，由于水活度降低及酸分子的吸附等作用，使测得的pH值偏高于真实值，这种误差称为酸差。"},
{n:58,t:"e",q:"简述紫外-可见吸收光谱法中吸收带的种类及影响因素。（6分）",a:"吸收带种类：① R带——由n→π*跃迁产生，ε小（<100），如羰基化合物；② K带——由共轭体系的π→π*跃迁产生，ε大（>10⁴）；③ B带——芳香族化合物的特征吸收带（苯的精细结构带）；④ E带——芳香族化合物的另一特征吸收带（E₁、E₂带）。\n影响因素：共轭体系的大小（共轭越长红移越大）、助色团与生色团、溶剂极性、空间位阻、溶液pH值等。"},
{n:59,t:"e",q:"在紫外-可见分光光度法中有哪几种跃迁类型？（7分）",a:"主要有四种电子跃迁类型：\n① σ→σ*跃迁：所需能量最大，吸收在远紫外区（<200nm），如饱和烷烃；\n② n→σ*跃迁：含孤对电子的杂原子化合物，吸收多在150~250nm，能量较大；\n③ π→π*跃迁：不饱和化合物，孤立双键约在200nm附近，共轭体系移至近紫外区且ε很大（K带）；\n④ n→π*跃迁：含杂原子的不饱和基团（如C=O），吸收在近紫外-可见区，ε小（R带）。\n能量顺序：σ→σ* > n→σ* > π→π* > n→π*。"}
]},

{n:60,t:"e",q:"CaCO₃试样中杂质不干扰测定。称取该试样0.2495g，加入HCl标准溶液25.00mL使之完全溶解，煮沸除去CO₂，剩余的HCl溶液用NaOH标准溶液滴定，消耗体积为12.xx mL（原题此处数据不完整）。（10分）",a:"⚠️ 原题数据不完整（HCl/NaOH浓度及NaOH体积未给全），以下为标准解法模板：\n本题属返滴定法。反应：CaCO₃+2HCl=CaCl₂+CO₂↑+H₂O；剩余HCl用NaOH滴定：HCl+NaOH=NaCl+H₂O。\n与CaCO₃反应的HCl物质的量 n(HCl)=c(HCl)·V(HCl)-c(NaOH)·V(NaOH)\nCaCO₃质量 m=½×n(HCl)×M(CaCO₃)，M(CaCO₃)=100.09 g/mol\n质量分数 w(CaCO₃)=[c(HCl)·V(HCl)-c(NaOH)·V(NaOH)]×100.09/(2×m样×1000)×100%\n将题目实际数据代入即可。若拿到完整题目可重新计算。"},
{n:61,t:"e",q:"称取维生素C 0.05 g溶于100 ml 0.0005 mol/L的硫酸溶液中，再准确量取此溶液2.00 ml稀释至100 ml，取此溶液于1 cm吸收池中，在λmax 245 nm处测得A值为0.551，求……（原题此处数据不完整）。（10分）",a:"⚠️ 原题求算部分不完整（通常求百分吸收系数E¹%₁cm及含量），标准解法：\n① 稀释倍数：2.00mL→100mL，稀释50倍；\n② 测定液浓度 c=0.05g/100mL÷50=1.0×10⁻⁵ g/mL=0.001 g/100mL；\n③ 由A=E¹%₁cm·c·b（c以g/100mL计，b=1cm）：\nE¹%₁cm=A/(c·b)=0.551/(0.001×1)=551\n④ 若与标准吸收系数比较可求含量：含量%=E测/E标×100%。\n拿到完整题目数据后可直接代入计算。"}

const LS_KEY="fxhx_quiz_v1";
const LETTERS=["A","B","C","D","E"];
let store;
try{store=JSON.parse(localStorage.getItem(LS_KEY)||"{}");}catch(e){store={};}
let screen="home",curPaper="p1",curMode="practice",curFilter="all";

function save(){localStorage.setItem(LS_KEY,JSON.stringify(store));}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function qid(p,s,i){return p+"-"+s+"-"+i;}
function paperStats(p){
  let objTotal=0,objDone=0,right=0,essayTotal=0,essayDone=0;
  PAPERS[p].sections.forEach((sec,si)=>sec.list.forEach((q,qi)=>{
    const rec=store[qid(p,si,qi)];
    if(q.t==="c"||q.t==="j"){
      objTotal++;
      if(rec&&rec.done){objDone++;if(rec.right)right++;}
    }else{
      essayTotal++;
      if(rec&&rec.done)essayDone++;
    }
  }));
  return{objTotal,objDone,right,essayTotal,essayDone,
    total:objTotal+essayTotal,done:objDone+essayDone,wrong:objDone-right};
}

  const app=document.getElementById("app");
  const P=PAPERS[curPaper],st=paperStats(curPaper);
  const pct=st.total?Math.round(st.done/st.total*100):0;
  const acc=st.objDone?Math.round(st.right/st.objDone*100):0;
  let quiz="",shown=0;
  P.sections.forEach((sec,si)=>{
    const cards=[];
    sec.list.forEach((q,qi)=>{
      const id=qid(curPaper,si,qi),rec=store[id];
      const isObj=(q.t==="c"||q.t==="j");
      const done=!!(rec&&rec.done);
      if(curFilter==="todo"&&done)return;
      if(curFilter==="wrong"&&(!isObj||!done||rec.right))return;
      shown++;
      let tag="";
      if(isObj){
        tag=done?(rec.right?'<span class="tag ok">✓ 答对</span>':'<span class="tag bad">✗ 答错</span>'):'<span class="tag todo">未做</span>';
      }else{
        tag=done?'<span class="tag ok">✓ 已掌握</span>':'<span class="tag todo">未做</span>';
      }
      const typeName=q.t==="c"?"单选题":(q.t==="j"?"判断题":"主观题");
      let html=`<div class="qmeta">${tag}<span class="qno">第 ${q.n} 题 · ${typeName}</span></div><div class="stem">${esc(q.q)}</div>`;
      if(isObj){
        const opts=q.t==="j"?["对","错"]:q.o;
        const answered=!!(rec&&rec.done);
        const reveal=curMode==="review"||answered;
        html+='<div class="opts">';
        opts.forEach((op,oi)=>{
          const letter=q.t==="j"?op:LETTERS[oi];
          const isImg=q.t==="c"&&String(op).startsWith("data:image");
          let cls="opt";
          if(reveal){
            if(letter===q.a)cls+=" correct";
            else if(answered&&rec.pick===letter)cls+=" wrong";
          }
          if(curMode==="review"||(answered&&rec.right))cls+=" locked";
          const content=isImg?`<img src="${op}" alt="选项${letter}">`:esc(op);
          html+=`<button class="${cls}" data-q="${id}" data-v="${letter}" data-si="${si}" data-qi="${qi}"><b>${letter}${q.t==="j"?"":"."}</b>${q.t==="j"?"":`<span>${content}</span>`}</button>`;
        });
        html+="</div>";
        html+=`<div class="analysis ${reveal?"show":""}" id="an-${id}"><b>答案：${q.a}</b>　${esc(q.an||"")}</div>`;
      }else{
        html+=`<div class="essay-acts"><button class="essay-btn" data-essay="${id}">查看参考答案</button><button class="essay-btn ${done?"on":""}" data-master="${id}">${done?"↩ 取消掌握":"✅ 标记已掌握"}</button></div>`;
        html+=`<div class="analysis ${curMode==="review"?"show":""}" id="an-${id}"><b>参考答案：</b>${esc(q.a)}</div>`;
      }
      const card=document.createElement("div");
      card.className="qcard";card.innerHTML=html;
      cards.push(card);
    });
    if(cards.length){
      quiz+=`<div class="sec-title">${esc(sec.name)}</div>`;
      cards.forEach(c=>quiz+=c.outerHTML);
    }
  });
  if(!shown)quiz='<div class="empty">该筛选条件下暂无题目 🎉</div>';
  const wrongN=st.wrong;
  app.innerHTML=`
  <div class="topbar">
    <button class="back" data-act="home">← 返回</button>
    <div class="tb-title">${esc(P.name)}</div>
    <div class="tb-pct">${pct}%</div>
  </div>
  <div class="statcard">
    <div class="stat-line">
      <span>已做 <b>${st.done}</b>/${st.total}</span>
      <span class="g">客观题答对 <b>${st.right}</b></span>
      <span class="r">答错 <b>${wrongN}</b></span>
      <span>正确率 <b>${acc}%</b></span>
      <span>主观题已掌握 <b>${st.essayDone}</b>/${st.essayTotal}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>
  <div class="controls">
    <div class="ctl-row">
      <span class="ctl-label">模式</span>
      <div class="seg" id="modeSeg">
        <button data-mode="practice" class="${curMode==="practice"?"on":""}">✍️ 练习模式</button>
        <button data-mode="review" class="${curMode==="review"?"on":""}">📖 背题模式</button>
      </div>
      <button class="reset" data-act="reset">🗑 重置本卷做题记录</button>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">题目</span>
      <div class="seg" id="filterSeg">
        <button data-filter="all" class="${curFilter==="all"?"on":""}">全部</button>
        <button data-filter="todo" class="${curFilter==="todo"?"on":""}">未做</button>
        <button data-filter="wrong" class="${curFilter==="wrong"?"on":""}">错题${wrongN?`（${wrongN}）`:""}</button>
      </div>
    </div>
  </div>
  <div>${quiz}</div>`;
}

function render(){
  if(screen==="home")renderHome();else renderPaper();
  window.scrollTo(0,0);
}

/* ---------- 事件 ---------- */
document.getElementById("app").addEventListener("click",e=>{
  const card=e.target.closest(".paper-card");
  if(card){curPaper=card.dataset.paper;screen="paper";render();return;}
  const btn=e.target.closest("button");
  if(!btn)return;
  if(btn.dataset.act==="home"){screen="home";render();return;}
  if(btn.dataset.act==="reset"){
    const st=paperStats(curPaper);
    if(!st.done){alert("本卷还没有做题记录");return;}
    if(!confirm(`确定清除${PAPERS[curPaper].name}的全部做题记录吗？\n（已做 ${st.done} 题，此操作不可恢复）`))return;
    Object.keys(store).forEach(k=>{if(k.startsWith(curPaper+"-"))delete store[k];});
    save();render();return;
  }
  if(btn.dataset.master){
    const mid=btn.dataset.master;
    if(store[mid]&&store[mid].done)delete store[mid];
    else store[mid]={done:true,right:true};
    save();render();return;
  }
  if(btn.dataset.essay){
    const el=document.getElementById("an-"+btn.dataset.essay);
    el.classList.toggle("show");
    btn.textContent=el.classList.contains("show")?"收起参考答案":"查看参考答案";
    return;
  }
  if(btn.dataset.mode){curMode=btn.dataset.mode;render();return;}
  if(btn.dataset.filter){curFilter=btn.dataset.filter;render();return;}
  if(curMode==="review")return;
  if(!btn.dataset.q)return;
  const id=btn.dataset.q,si=+btn.dataset.si,qi=+btn.dataset.qi;
  const q=PAPERS[curPaper].sections[si].list[qi];
  const rec=store[id];
  if(rec&&rec.done&&rec.right)return;               // 已答对的锁定
  const right=btn.dataset.v===q.a;
  store[id]={done:true,right,pick:btn.dataset.v};   // 答错可重选，覆盖记录
  save();render();
  const cardEl=btn.closest(".qcard");
  if(cardEl)window.scrollTo(0,window.scrollY+cardEl.getBoundingClientRect().top-90);
});
render();
</script>
</body>
</html>
